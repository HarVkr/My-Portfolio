<style>
/* ================================================================
   RESET & COLOR PALETTE VARIABLES
   ================================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #090909;        /* obsidian black */
  --bg-secondary: #171719;      /* charcoal */
  --accent-primary: #B51F32;    /* deep crimson */
  --accent-secondary: #D33B4C;  /* lighter crimson */
  --text-primary: #E7E2DF;      /* soft white */
  --text-secondary: #A7A2A0;    /* muted grey */
  --border-subtle: #242428;     /* subtle charcoal-grey */
  --frame-bg: #0c0c0e;
  --perf-bg: #18181c;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ================================================================
   YOUR NEXT WATCH — SECTION
   ================================================================ */
.ynw-section {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px 70px;
  overflow: hidden;
}

/* Atmospheric crimson ambient glow behind the section */
.ynw-section::before {
  content: '';
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  height: 65%;
  background: radial-gradient(ellipse at center,
    rgba(181, 31, 50, 0.04) 0%,
    rgba(181, 31, 50, 0.012) 40%,
    transparent 70%
  );
  pointer-events: none;
  z-index: 0;
}

/* ─── Content Wrapper (Max Width Constraint) ─── */
.ynw-container {
  width: 100%;
  max-width: 1440px;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* ─── Section Header (Left Aligned as in Sketches) ─── */
.ynw-header {
  text-align: left;
  margin-bottom: 44px;
  padding-left: 4px;
  opacity: 0;
  transform: translateY(24px);
  animation: ynw-fadeUp 0.8s ease-out 0.15s forwards;
}

.ynw-header h2 {
  font-family: 'Clash Display', sans-serif;
  font-size: clamp(38px, 4.6vw, 60px);
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text-primary);
  line-height: 1.1;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.ynw-header .ynw-subtitle {
  color: var(--text-secondary);
  font-size: 15px;
  letter-spacing: 1.2px;
  font-weight: 400;
}

/* ─── Reels Grid (Side-by-side) ─── */
.ynw-reels {
  display: flex;
  gap: 36px;
  justify-content: center;
  align-items: flex-start;
  width: 100%;
}

/* ─── Individual Reel Column ─── */
.ynw-reel {
  flex: 1;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  opacity: 0;
  transform: translateY(30px);
}

.ynw-reel:nth-child(1) {
  animation: ynw-fadeUp 0.8s ease-out 0.35s forwards;
}

.ynw-reel:nth-child(2) {
  animation: ynw-fadeUp 0.8s ease-out 0.5s forwards;
}

/* Atmospheric glow per reel */
.ynw-reel::before {
  content: '';
  position: absolute;
  top: 52%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 65%;
  height: 45%;
  background: radial-gradient(ellipse, rgba(181, 31, 50, 0.045) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ================================================================
   CAROUSEL VIEWPORT & 3D CYLINDER
   ================================================================ */
.ynw-viewport {
  position: relative;
  width: 100%;
  height: 330px;
  perspective: 900px;
  perspective-origin: 50% 42%;
  overflow: visible;
  z-index: 1;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y; /* allow vertical page scroll if not dragging horizontally */
}

.ynw-viewport.is-dragging {
  cursor: grabbing !important;
}

/* ─── Roll Top Curve (Prominent 3D Hint) ─── */
.ynw-roll-top {
  position: absolute;
  top: -22px;
  left: 3%;
  right: 3%;
  height: 40px;
  z-index: 6;
  pointer-events: none;
}

.ynw-roll-top::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 100%;
  background: linear-gradient(180deg,
    #212126 0%,
    #18181b 36%,
    rgba(23, 23, 25, 0.5) 72%,
    transparent 100%
  );
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  border-top: 1.5px solid #3c3c43;
  border-left: 1px solid rgba(60, 60, 67, 0.4);
  border-right: 1px solid rgba(60, 60, 67, 0.4);
}

/* Specular sheen on roll top */
.ynw-roll-top::after {
  content: '';
  position: absolute;
  bottom: 6px;
  left: 15%;
  right: 15%;
  height: 60%;
  background: linear-gradient(180deg,
    rgba(255, 255, 255, 0.05) 0%,
    rgba(255, 255, 255, 0.015) 50%,
    transparent 100%
  );
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}

/* ─── Roll Bottom Curve ─── */
.ynw-roll-bottom {
  position: absolute;
  bottom: -12px;
  left: 6%;
  right: 6%;
  height: 20px;
  z-index: 6;
  pointer-events: none;
}

.ynw-roll-bottom::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 100%;
  background: linear-gradient(0deg,
    rgba(12, 12, 14, 0.95) 0%,
    rgba(23, 23, 25, 0.3) 60%,
    transparent 100%
  );
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
  border-bottom: 1.2px solid rgba(48, 48, 54, 0.6);
}

/* ─── 3D Scene ─── */
.ynw-scene {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
}

.ynw-scene.is-transitioning {
  transition: transform 0.75s cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* ================================================================
   FILM FRAME (35mm Realistic Strip)
   ================================================================ */
.ynw-frame {
  position: absolute;
  width: 82%;
  height: 290px;
  left: 9%;
  top: 20px;
  backface-visibility: hidden;
  transition: opacity 0.75s ease, filter 0.75s ease;
  will-change: opacity, filter;
  cursor: pointer;
}

.ynw-frame.is-active {
  opacity: 1;
  filter: brightness(1);
  z-index: 5;
}

.ynw-frame.is-adjacent {
  opacity: 0.42;
  filter: brightness(0.48);
  cursor: pointer;
  z-index: 3;
}

.ynw-frame.is-hidden {
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}

/* ─── Film Strip ─── */
.ynw-strip {
  width: 100%;
  height: 100%;
  background: var(--frame-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.6),
    inset 0 0 60px rgba(0, 0, 0, 0.15);
  transition: box-shadow 0.4s ease, border-color 0.4s ease;
}

.ynw-frame.is-active .ynw-strip {
  border-color: rgba(60, 60, 68, 0.8);
  box-shadow:
    0 8px 40px rgba(0, 0, 0, 0.7),
    0 0 80px rgba(181, 31, 50, 0.05),
    inset 0 0 50px rgba(0, 0, 0, 0.1);
}

.ynw-frame.is-active:hover .ynw-strip {
  border-color: rgba(181, 31, 50, 0.45);
  box-shadow:
    0 8px 45px rgba(0, 0, 0, 0.8),
    0 0 100px rgba(181, 31, 50, 0.1),
    inset 0 0 50px rgba(0, 0, 0, 0.08);
}

/* ─── Perforations (Sprocket Holes) ─── */
.ynw-perfs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 6px 12px;
  flex-shrink: 0;
  background: rgba(0, 0, 0, 0.55);
  border-bottom: 1px solid rgba(255, 255, 255, 0.02);
}

.ynw-perfs.ynw-perfs--bottom {
  border-bottom: none;
  border-top: 1px solid rgba(255, 255, 255, 0.02);
}

.ynw-perf {
  width: 11px;
  height: 7px;
  border-radius: 1.5px;
  background: var(--perf-bg);
  border: 1px solid #28282e;
  flex-shrink: 0;
}

/* ─── Film Content Area ─── */
.ynw-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 32px;
  position: relative;
  background: linear-gradient(145deg,
    rgba(12, 12, 14, 1) 0%,
    rgba(19, 19, 22, 0.95) 45%,
    rgba(12, 12, 14, 1) 100%
  );
}

/* Crimson ambient highlight inside active frame */
.ynw-frame.is-active .ynw-content::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center,
    rgba(181, 31, 50, 0.08) 0%,
    transparent 65%
  );
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.ynw-frame.is-active:hover .ynw-content::before {
  background: radial-gradient(ellipse at center,
    rgba(181, 31, 50, 0.13) 0%,
    transparent 65%
  );
}

/* ─── Typography Inside Frame ─── */
.ynw-tag {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent-primary);
  background: rgba(181, 31, 50, 0.1);
  border: 1px solid rgba(181, 31, 50, 0.22);
  padding: 3px 14px;
  border-radius: 2px;
  margin-bottom: 12px;
  transition: all 0.3s ease;
}

.ynw-frame.is-active:hover .ynw-tag {
  background: rgba(181, 31, 50, 0.18);
  border-color: rgba(181, 31, 50, 0.4);
}

.ynw-title {
  font-family: 'Clash Display', sans-serif;
  font-size: clamp(28px, 3.2vw, 38px);
  font-weight: 700;
  color: var(--text-primary);
  text-align: center;
  letter-spacing: 1.5px;
  line-height: 1.15;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.ynw-desc {
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.55;
  max-width: 360px;
  font-weight: 400;
}

/* ─── Expand Frame Hint on Hover ─── */
.ynw-expand-hint {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent-primary);
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.3s ease;
}

.ynw-frame.is-active:hover .ynw-expand-hint {
  opacity: 1;
  transform: translateY(0);
}

.ynw-expand-hint svg {
  width: 13px;
  height: 13px;
  stroke: var(--accent-primary);
  fill: none;
  stroke-width: 2.2;
}

/* ─── Edge Markings ─── */
.ynw-edge {
  position: absolute;
  bottom: 6px;
  font-size: 7.5px;
  letter-spacing: 2px;
  color: rgba(167, 162, 160, 0.2);
  text-transform: uppercase;
  font-family: 'Courier New', monospace;
}

.ynw-edge--left { left: 14px; }
.ynw-edge--right { right: 14px; }

/* ================================================================
   NAVIGATION & CONTROLS
   ================================================================ */
.ynw-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 24px;
  width: 100%;
  position: relative;
  z-index: 5;
}

.ynw-arrow {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s ease;
  user-select: none;
  -webkit-user-select: none;
  outline: none;
}

.ynw-arrow:hover {
  border-color: var(--accent-primary);
  color: var(--text-primary);
  background: rgba(181, 31, 50, 0.1);
  box-shadow: 0 0 20px rgba(181, 31, 50, 0.12);
}

.ynw-arrow:active {
  transform: scale(0.9);
}

/* ─── Dot Indicators ─── */
.ynw-dots {
  display: flex;
  gap: 7px;
  align-items: center;
}

.ynw-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--border-subtle);
  transition: all 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
}

.ynw-dot:hover {
  background: var(--text-secondary);
}

.ynw-dot.is-active {
  background: var(--accent-primary);
  box-shadow: 0 0 10px rgba(181, 31, 50, 0.55);
  width: 24px;
  border-radius: 4px;
}

/* ─── Frame Counter ─── */
.ynw-counter {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  margin-top: 10px;
  text-align: center;
  position: relative;
  z-index: 5;
}

.ynw-counter .ynw-counter-current {
  color: var(--text-primary);
  font-weight: 600;
}

.ynw-counter .ynw-counter-name {
  color: var(--text-secondary);
  font-size: 11px;
  opacity: 0.65;
  margin-left: 8px;
  letter-spacing: 0.5px;
}

/* ================================================================
   FILM GRAIN OVERLAY
   ================================================================ */
.ynw-viewport::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 10;
}

/* ================================================================
   ENTRANCE ANIMATION
   ================================================================ */
@keyframes ynw-fadeUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================================================================
   RESPONSIVE DESIGN
   ================================================================ */
@media (max-width: 1050px) {
  .ynw-reels {
    gap: 28px;
  }
  .ynw-viewport {
    height: 330px;
  }
  .ynw-frame {
    height: 288px;
  }
}

@media (max-width: 900px) {
  .ynw-section {
    padding: 60px 20px 50px;
  }
  .ynw-reels {
    flex-direction: column;
    align-items: center;
    gap: 56px;
  }
  .ynw-reel {
    width: 100%;
    max-width: 600px;
  }
  .ynw-header {
    margin-bottom: 36px;
  }
}

@media (max-width: 540px) {
  .ynw-section {
    padding: 40px 14px 40px;
  }
  .ynw-viewport {
    height: 295px;
    perspective: 800px;
  }
  .ynw-frame {
    height: 254px;
    width: 90%;
    left: 5%;
  }
  .ynw-title {
    font-size: 24px;
  }
  .ynw-desc {
    font-size: 12px;
  }
  .ynw-content {
    padding: 12px 18px;
  }
  .ynw-perfs {
    gap: 8px;
  }
  .ynw-perf {
    width: 9px;
    height: 6px;
  }
}

/* ================================================================
   CINEMATIC EXPANSION ANIMATION & PROJECT DETAIL EXPERIENCE
   ================================================================ */

/* Dual-cylinder container recedes & blurs in the background (depth of field) */
.ynw-container.ynw-receding {
  filter: blur(8px) brightness(0.48);
  opacity: 0.55;
  pointer-events: none;
  transition: filter 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.65s ease;
}

/* Immediately concealed origin frame during shared-element animation */
.ynw-frame.is-concealed {
  opacity: 0 !important;
  visibility: hidden !important;
  transition: none !important;
}

/* Cinematic dark backdrop with radial crimson glow */
.ynw-expansion-backdrop {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 40%, rgba(181, 31, 50, 0.08) 0%, rgba(9, 9, 9, 0.94) 75%);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.ynw-expansion-backdrop.is-active {
  opacity: 1;
  pointer-events: auto;
}

/* Expanding film portal (shared-element bridge) */
.ynw-expansion-portal {
  position: fixed;
  z-index: 100;
  box-sizing: border-box;
  background: var(--frame-bg);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.88),
    0 0 70px rgba(181, 31, 50, 0.12),
    inset 0 0 60px rgba(0, 0, 0, 0.3);
  transition:
    top 0.62s cubic-bezier(0.16, 1, 0.3, 1),
    left 0.62s cubic-bezier(0.16, 1, 0.3, 1),
    width 0.62s cubic-bezier(0.16, 1, 0.3, 1),
    height 0.62s cubic-bezier(0.16, 1, 0.3, 1),
    box-shadow 0.4s ease,
    border-color 0.4s ease;
  will-change: top, left, width, height;
}

.ynw-expansion-portal.is-expanded {
  border-color: rgba(181, 31, 50, 0.4);
  box-shadow:
    0 35px 100px rgba(0, 0, 0, 0.95),
    0 0 110px rgba(181, 31, 50, 0.16),
    inset 0 0 80px rgba(0, 0, 0, 0.25);
}

/* Top & bottom film strip perforations on the expanded surface */
.ynw-portal-perfs {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: rgba(0, 0, 0, 0.8);
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  flex-shrink: 0;
  height: 20px;
  box-sizing: border-box;
  z-index: 5;
  user-select: none;
}

.ynw-portal-perfs.ynw-portal-perfs--bottom {
  border-bottom: none;
  border-top: 1px solid rgba(255, 255, 255, 0.03);
}

.ynw-portal-holes {
  display: flex;
  gap: 12px;
  align-items: center;
  overflow: hidden;
  flex: 1;
}

.ynw-portal-hole {
  width: 11px;
  height: 7px;
  border-radius: 1.5px;
  background: var(--perf-bg);
  border: 1px solid #28282e;
  flex-shrink: 0;
}

.ynw-portal-meta {
  font-family: 'Courier New', monospace;
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(167, 162, 160, 0.28);
  text-transform: uppercase;
  margin-left: 16px;
  white-space: nowrap;
}

/* Middle body between top and bottom perforations */
.ynw-portal-body {
  flex: 1;
  position: relative;
  width: 100%;
  overflow: hidden;
  background: var(--frame-bg);
}

/* Initial preview surface inside portal body */
.ynw-portal-preview {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 28px;
  background: linear-gradient(145deg,
    rgba(12, 12, 14, 1) 0%,
    rgba(19, 19, 22, 0.95) 45%,
    rgba(12, 12, 14, 1) 100%
  );
  opacity: 1;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.ynw-expansion-portal.is-content-revealed .ynw-portal-preview {
  opacity: 0;
}

/* Expanded project detail container inside portal body */
.ynw-detail-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
  overflow: hidden;
}

.ynw-expansion-portal.is-content-revealed .ynw-detail-container {
  opacity: 1;
  pointer-events: auto;
}

/* Top bar with back button & collection status */
.ynw-detail-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid rgba(42, 42, 46, 0.6);
  background: rgba(14, 14, 16, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  flex-shrink: 0;
  z-index: 10;
}

.ynw-detail-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-radius: 4px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.25s ease;
  outline: none;
}

.ynw-detail-back-btn:hover {
  background: rgba(181, 31, 50, 0.12);
  border-color: var(--accent-primary);
  color: #fff;
  box-shadow: 0 0 20px rgba(181, 31, 50, 0.15);
}

.ynw-detail-back-btn svg {
  transition: transform 0.25s ease;
}

.ynw-detail-back-btn:hover svg {
  transform: translateX(-3px);
}

.ynw-detail-kbd {
  font-size: 10px;
  font-family: monospace;
  color: var(--text-secondary);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 2px 6px;
  border-radius: 3px;
  margin-left: 6px;
}

.ynw-detail-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.ynw-detail-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-primary);
  box-shadow: 0 0 8px rgba(181, 31, 50, 0.8);
}

/* Scrollable case study body */
.ynw-detail-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 36px 36px 60px;
  display: flex;
  flex-direction: column;
  gap: 36px;
  scrollbar-width: thin;
  scrollbar-color: #2e2e34 transparent;
}

.ynw-detail-scroll::-webkit-scrollbar {
  width: 6px;
}

.ynw-detail-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.ynw-detail-scroll::-webkit-scrollbar-thumb {
  background: #2e2e34;
  border-radius: 3px;
}

.ynw-detail-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--accent-primary);
}

/* Hero section inside detail */
.ynw-detail-hero {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px solid rgba(42, 42, 46, 0.5);
  padding-bottom: 28px;
}

.ynw-detail-hero-tag {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent-primary);
  background: rgba(181, 31, 50, 0.12);
  border: 1px solid rgba(181, 31, 50, 0.28);
  padding: 4px 14px;
  border-radius: 2px;
}

.ynw-detail-hero-title {
  font-family: 'Clash Display', sans-serif;
  font-size: clamp(36px, 4.5vw, 54px);
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text-primary);
  line-height: 1.1;
  text-transform: uppercase;
}

.ynw-detail-hero-desc {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.6;
  max-width: 760px;
  font-weight: 400;
}

/* Main Visual / Case Study Media Canvas */
.ynw-detail-canvas {
  width: 100%;
  min-height: 380px;
  background: radial-gradient(ellipse at 50% 50%, rgba(181, 31, 50, 0.05) 0%, rgba(16, 16, 18, 0.95) 60%);
  border: 1px solid rgba(42, 42, 48, 0.8);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.4);
}

/* Technical grid background in media canvas */
.ynw-detail-canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  background-size: 32px 32px;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  pointer-events: none;
}

/* Corner crop reticles */
.ynw-detail-canvas::after {
  content: '';
  position: absolute;
  inset: 16px;
  border: 1px dashed rgba(167, 162, 160, 0.12);
  pointer-events: none;
}

.ynw-detail-canvas-label {
  font-family: 'Clash Display', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-primary);
  margin-bottom: 8px;
  position: relative;
  z-index: 2;
  text-align: center;
}

.ynw-detail-canvas-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 440px;
}

/* Structured Wireframe Case Study Sections */
.ynw-detail-sections {
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.ynw-detail-card {
  background: rgba(18, 18, 21, 0.75);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.ynw-detail-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(42, 42, 46, 0.4);
  padding-bottom: 12px;
}

.ynw-detail-card-title {
  font-family: 'Clash Display', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-primary);
}

.ynw-detail-card-tag {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent-primary);
}

.ynw-detail-card-wireframe {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ynw-detail-wire-line {
  height: 10px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 2px;
}

.ynw-detail-wire-line--long { width: 100%; }
.ynw-detail-wire-line--med  { width: 85%; }
.ynw-detail-wire-line--short{ width: 65%; }


/* ================================================================
   REVIFY CASE STUDY & INTERACTIVE SCREEN SHOWCASE STYLES
   ================================================================ */

/* Top bar actions & links */
.ynw-detail-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ynw-detail-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.25s ease;
  white-space: nowrap;
}

.ynw-detail-link-btn:hover {
  background: rgba(181, 31, 50, 0.12);
  border-color: var(--accent-primary);
  color: #fff;
  box-shadow: 0 0 16px rgba(181, 31, 50, 0.15);
}

.ynw-detail-link-btn--primary {
  background: rgba(181, 31, 50, 0.18);
  border-color: rgba(181, 31, 50, 0.45);
  color: #fff;
}

.ynw-detail-link-btn--primary:hover {
  background: var(--accent-primary);
  box-shadow: 0 0 20px rgba(181, 31, 50, 0.4);
}

.ynw-live-pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
  animation: ynw-pulse 2s infinite ease-in-out;
}

@keyframes ynw-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.85); }
}

/* Metric Badges Grid */
.ynw-metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  width: 100%;
  margin-top: 14px;
}

.ynw-metric-card {
  background: rgba(18, 18, 22, 0.85);
  border: 1px solid rgba(42, 42, 48, 0.8);
  border-radius: 4px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
}

.ynw-metric-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--border-subtle);
  transition: background 0.25s ease;
}

.ynw-metric-card:hover {
  border-color: rgba(181, 31, 50, 0.45);
  background: rgba(22, 22, 28, 0.95);
  transform: translateY(-2px);
}

.ynw-metric-card:hover::before {
  background: var(--accent-primary);
  box-shadow: 0 0 10px rgba(181, 31, 50, 0.8);
}

.ynw-metric-val {
  font-family: 'Clash Display', sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-primary);
  line-height: 1.1;
}

.ynw-metric-val--crimson {
  color: #ff4d61;
}

.ynw-metric-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-top: 2px;
}

.ynw-metric-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: rgba(167, 162, 160, 0.65);
}

/* ─── Interactive Screen Showcase Canvas ─── */
.ynw-showcase-box {
  width: 100%;
  background: #0d0d10;
  border: 1px solid rgba(42, 42, 48, 0.85);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-direction: column;
}

.ynw-showcase-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: #141418;
  border-bottom: 1px solid rgba(42, 42, 48, 0.85);
  flex-wrap: wrap;
  gap: 12px;
}

.ynw-showcase-browser-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.ynw-showcase-dots {
  display: flex;
  gap: 6px;
  align-items: center;
}

.ynw-showcase-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.ynw-showcase-dot--red    { background: #e0443e; }
.ynw-showcase-dot--yellow { background: #dea123; }
.ynw-showcase-dot--green  { background: #1aab29; }

.ynw-showcase-address {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: var(--text-secondary);
  background: #0a0a0c;
  padding: 5px 14px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  min-width: 260px;
}

.ynw-showcase-tabs {
  display: flex;
  gap: 6px;
}

.ynw-showcase-tab {
  background: transparent;
  border: 1px solid transparent;
  padding: 6px 14px;
  border-radius: 4px;
  color: var(--text-secondary);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.ynw-showcase-tab:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.04);
}

.ynw-showcase-tab.is-active {
  color: #fff;
  background: rgba(181, 31, 50, 0.2);
  border-color: rgba(181, 31, 50, 0.5);
  box-shadow: 0 0 12px rgba(181, 31, 50, 0.2);
}

.ynw-showcase-panel {
  padding: 28px;
  display: none;
  min-height: 380px;
  background: radial-gradient(ellipse at 50% 30%, rgba(20, 20, 26, 0.6) 0%, rgba(11, 11, 14, 0.98) 100%);
  position: relative;
}

.ynw-showcase-panel.is-active {
  display: block;
  animation: ynw-screenFade 0.3s ease;
}

@keyframes ynw-screenFade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── Screen 1: Feature Weighting Slider UI ─── */
.ynw-sc-input-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  width: 100%;
}

.ynw-sc-input {
  flex: 1;
  background: #15151a;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 10px 16px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #e5e5e7;
  outline: none;
}

.ynw-sc-input:focus {
  border-color: var(--accent-primary);
}

.ynw-sc-btn {
  background: var(--accent-primary);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 0 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s ease;
}

.ynw-sc-btn:hover {
  background: #cc253b;
}

.ynw-sc-sliders-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.ynw-sc-slider-card {
  background: rgba(22, 22, 28, 0.7);
  border: 1px solid rgba(42, 42, 48, 0.7);
  border-radius: 4px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.ynw-sc-slider-meta {
  width: 240px;
  flex-shrink: 0;
}

.ynw-sc-slider-title {
  font-family: 'Clash Display', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.ynw-sc-slider-note {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: var(--text-secondary);
}

.ynw-sc-slider-controls {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 16px;
}

.ynw-sc-range {
  flex: 1;
  accent-color: var(--accent-primary);
  cursor: pointer;
}

.ynw-sc-val-badge {
  font-family: 'Clash Display', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  background: rgba(181, 31, 50, 0.16);
  border: 1px solid rgba(181, 31, 50, 0.35);
  padding: 3px 10px;
  border-radius: 3px;
  min-width: 64px;
  text-align: center;
}

/* ─── Screen 2: Multi-Agent Execution Pipeline UI ─── */
.ynw-sc-pipeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(42, 42, 48, 0.6);
}

.ynw-sc-pipeline-title {
  font-family: 'Clash Display', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}

.ynw-sc-pipeline-time {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: var(--text-secondary);
}

.ynw-sc-agent-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ynw-sc-agent-row {
  background: rgba(20, 20, 26, 0.7);
  border: 1px solid rgba(42, 42, 48, 0.8);
  border-radius: 4px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  transition: all 0.2s ease;
}

.ynw-sc-agent-row.is-active {
  border-color: rgba(181, 31, 50, 0.5);
  background: rgba(28, 22, 26, 0.8);
  box-shadow: 0 0 16px rgba(181, 31, 50, 0.12);
}

.ynw-sc-agent-info {
  display: flex;
  align-items: center;
  gap: 14px;
}

.ynw-sc-agent-icon {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-primary);
  font-family: 'Clash Display', sans-serif;
  font-size: 12px;
  font-weight: 700;
}

.ynw-sc-agent-icon--running {
  color: #eab308;
  border-color: #eab308;
}

.ynw-sc-agent-name {
  font-family: 'Clash Display', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.ynw-sc-agent-duty {
  font-family: 'DM Sans', sans-serif;
  font-size: 11.5px;
  color: var(--text-secondary);
}

.ynw-sc-agent-pill {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.ynw-sc-agent-pill--done {
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.35);
  color: #22c55e;
}

.ynw-sc-agent-pill--running {
  background: rgba(234, 179, 8, 0.14);
  border: 1px solid rgba(234, 179, 8, 0.4);
  color: #eab308;
}

/* ─── Screen 3: Personalized Rating & Sentiment UI ─── */
.ynw-gallery-grid,
  .ynw-sc-rating-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
  align-items: start;
}

.ynw-sc-rating-main {
  background: rgba(22, 22, 28, 0.85);
  border: 1px solid rgba(181, 31, 50, 0.35);
  border-radius: 6px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 0 30px rgba(181, 31, 50, 0.12);
}

.ynw-sc-rating-score {
  font-family: 'Clash Display', sans-serif;
  font-size: 58px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  margin: 10px 0 4px;
}

.ynw-sc-rating-score span {
  font-size: 24px;
  color: var(--text-secondary);
  font-weight: 400;
}

.ynw-sc-rating-match {
  color: #22c55e;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
}

.ynw-sc-rating-tag {
  font-family: 'DM Sans', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent-primary);
  background: rgba(181, 31, 50, 0.14);
  padding: 3px 10px;
  border-radius: 2px;
}

.ynw-sc-rating-desc {
  font-family: 'DM Sans', sans-serif;
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-top: 10px;
  line-height: 1.45;
}

.ynw-sc-features-breakdown {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ynw-sc-feat-row {
  background: rgba(20, 20, 26, 0.65);
  border: 1px solid rgba(42, 42, 48, 0.7);
  border-radius: 4px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ynw-sc-feat-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ynw-sc-feat-title {
  font-family: 'Clash Display', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.ynw-sc-feat-pct {
  font-family: 'DM Sans', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  color: #22c55e;
}

.ynw-sc-feat-pct--mixed {
  color: #eab308;
}

.ynw-sc-feat-bar-track {
  width: 100%;
  height: 6px;
  background: #18181f;
  border-radius: 3px;
  overflow: hidden;
}

.ynw-sc-feat-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #b51f32 0%, #22c55e 100%);
  border-radius: 3px;
}

.ynw-sc-feat-bar-fill--mixed {
  background: linear-gradient(90deg, #b51f32 0%, #eab308 100%);
}

.ynw-sc-quote-box {

          openFilmDetail(self, i, frame, item);
        }
      });

      self.scene.appendChild(frame);
    });

    // Build Dots
    for (var i = 0; i < this.total; i++) {
      var dot = document.createElement('div');
      dot.className = 'ynw-dot' + (i === 0 ? ' is-active' : '');
      (function(idx) {
        dot.addEventListener('click', function() { self.goTo(idx); });
      })(i);
      this.dotsEl.appendChild(dot);
    }

    // Bind Arrow Buttons
    var buttons = document.querySelectorAll('[data-reel-target="' + this.reelKey + '"]');
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (isDetailActive) return;
        if (btn.getAttribute('data-dir') === 'prev') {
          self.goTo(self.current - 1);
        } else {
          self.goTo(self.current + 1);
        }
      });
    });

    // Setup Dragging & Scrolling Interactions
    this.setupInteractions();

    // Initial positioning
    this.scene.style.transform = 'translateZ(-' + RADIUS + 'px) rotateY(0deg)';
    this.updateClasses();
  };

  // ── Mouse Dragging & Touch Dragging ──
  FilmReel.prototype.setupInteractions = function() {
    var self = this;
    var vp = this.viewport;

    // Mouse Down
    vp.addEventListener('mousedown', function(e) {
      if (isDetailActive || e.button !== 0) return; // left click only
      self.isDragging = true;
      self.hasMoved = false;
      self.startX = e.clientX;
      self.dragOffset = 0;
      vp.classList.add('is-dragging');
      self.scene.classList.remove('is-transitioning');
      e.preventDefault();
    });

    // Window Mouse Move
    window.addEventListener('mousemove', function(e) {
      if (!self.isDragging || isDetailActive) return;
      var deltaX = e.clientX - self.startX;
      if (Math.abs(deltaX) > 4) {
        self.hasMoved = true;
      }
      self.dragOffset = deltaX;
      // Convert drag pixel displacement into rotation degrees
      // 300px drag ~= 1 frame (self.angle)
      var degDelta = (deltaX / 300) * self.angle;
      var currentBase = -self.accumDeg;
      self.scene.style.transform = 'translateZ(-' + RADIUS + 'px) rotateY(' + (currentBase + degDelta) + 'deg)';
    });

    // Window Mouse Up
    window.addEventListener('mouseup', function(e) {
      if (!self.isDragging) return;
      self.isDragging = false;
      vp.classList.remove('is-dragging');
      self.scene.classList.add('is-transitioning');

      var threshold = 45; // pixels to trigger frame step
      if (self.dragOffset < -threshold) {
        // Dragged left -> advance right/forward
        self.goTo(self.current + 1);
      } else if (self.dragOffset > threshold) {
        // Dragged right -> advance left/previous
        self.goTo(self.current - 1);
      } else {
        // Snap back to current
        self.goTo(self.current);
      }
      self.dragOffset = 0;
    });

    // Touch Support (Mobile)
    var touchStartX = 0;
    var touchStartY = 0;
    var isHorizontalSwipe = false;

    vp.addEventListener('touchstart', function(e) {
      if (isDetailActive) return;
      var t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      self.startX = t.clientX;
      self.isDragging = true;
      self.hasMoved = false;
      self.dragOffset = 0;
      isHorizontalSwipe = false;
      self.scene.classList.remove('is-transitioning');
    }, { passive: true });

    vp.addEventListener('touchmove', function(e) {
      if (!self.isDragging || isDetailActive) return;
      var t = e.touches[0];
      var deltaX = t.clientX - touchStartX;
      var deltaY = t.clientY - touchStartY;

      if (!isHorizontalSwipe && Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
        isHorizontalSwipe = true;
      }

      if (isHorizontalSwipe) {
        if (e.cancelable) e.preventDefault();
        self.hasMoved = true;
        self.dragOffset = deltaX;
        var degDelta = (deltaX / 260) * self.angle;
        self.scene.style.transform = 'translateZ(-' + RADIUS + 'px) rotateY(' + (-self.accumDeg + degDelta) + 'deg)';
      }
    }, { passive: false });

    vp.addEventListener('touchend', function() {
      if (!self.isDragging) return;
      self.isDragging = false;
      self.scene.classList.add('is-transitioning');

      var threshold = 40;
      if (self.dragOffset < -threshold) {
        self.goTo(self.current + 1);
      } else if (self.dragOffset > threshold) {
        self.goTo(self.current - 1);
      } else {
        self.goTo(self.current);
      }
      self.dragOffset = 0;
    });

    // ── Mouse Wheel / Trackpad Scrolling ──
    vp.addEventListener('wheel', function(e) {
      if (isDetailActive) return;
      var now = Date.now();
      // Throttle wheel events so one swipe moves exactly 1 frame
      if (now - self.lastScrollTime < 500) {
        e.preventDefault();
        return;
      }

      // Read both deltaX (trackpad horizontal) and deltaY (mouse vertical scroll)
      var dominantDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      var scrollThreshold = 18;

      if (Math.abs(dominantDelta) > scrollThreshold) {
        e.preventDefault();
        self.lastScrollTime = now;
        if (dominantDelta > 0) {
          // Scrolled down/right -> advance next
          self.goTo(self.current + 1);
        } else {
          // Scrolled up/left -> advance previous
          self.goTo(self.current - 1);
        }
      }
    }, { passive: false });
  };

  // ── Rotation Controller ──
  FilmReel.prototype.goTo = function(index) {
    if (this.isBusy || isDetailActive) return;
    this.isBusy = true;
    var self = this;

    // Shortest-path around circular cylinder
    var diff = index - this.current;
    if (diff > this.total / 2)  diff -= this.total;
    if (diff < -this.total / 2) diff += this.total;

    this.accumDeg += diff * this.angle;
    this.current = ((index % this.total) + this.total) % this.total;

    this.scene.classList.add('is-transitioning');
    this.scene.style.transform = 'translateZ(-' + RADIUS + 'px) rotateY(' + (-this.accumDeg) + 'deg)';
    this.updateClasses();

    setTimeout(function() {
      self.isBusy = false;
    }, ANIM_TIME);
  };

  // ── Update active / adjacent frame states ──
  FilmReel.prototype.updateClasses = function() {
    var self = this;
    var frames = this.scene.querySelectorAll('.ynw-frame');

    frames.forEach(function(f, i) {
      f.classList.remove('is-active', 'is-adjacent', 'is-hidden');
      var dist = ringDistance(i, self.current, self.total);
      if (dist === 0) {
        f.classList.add('is-active');
      } else if (Math.abs(dist) === 1) {
        f.classList.add('is-adjacent');
      } else {
        f.classList.add('is-hidden');
      }
    });

    // Update Dots
    var dots = this.dotsEl.querySelectorAll('.ynw-dot');
    dots.forEach(function(d, i) {
      d.classList.toggle('is-active', i === self.current);
    });

    // Update Counter Numbers
    this.curEl.textContent = pad(this.current + 1);

    // Update Display Name
    var currentItem = this.data[this.current];
    this.nameEl.textContent = currentItem.title.replace('\n', ' ');
  };

  // ── Math & Formatting Helpers ──
  function pad(n) {
    return String(n).padStart(2, '0');

  function ringDistance(target, current, total) {
    var d = target - current;
    if (d > total / 2)  d -= total;
    if (d < -total / 2) d += total;
    return d;
  }

  function openFilmDetail(reel, index, frameEl, itemData) {
    if (isDetailActive || isClosingDetail) return;
    isDetailActive = true;
    isClosingDetail = false;
    activeOriginReel = reel;
    activeOriginFrame = frameEl;

    // Settle cylinder into stationary position
    reel.scene.classList.add('is-transitioning');
    reel.scene.style.transform = 'translateZ(-' + RADIUS + 'px) rotateY(' + (-reel.accumDeg) + 'deg)';

    // Get origin coordinates BEFORE container recedes to guarantee exact pixel positioning
    var rect = frameEl.getBoundingClientRect();
    activeOriginRect = {
      top: rect.top,
      left: rect.left,
      width: rect.width,
      height: rect.height
    };

    // Stage 2: Cinematic backdrop & receding dual-cylinder mechanism
    var container = document.querySelector('.ynw-container');
    if (container) container.classList.add('ynw-receding');

    var backdrop = document.getElementById('ynw-expansion-backdrop');
    if (!backdrop) {
      backdrop = document.createElement('div');

    if (!isDetailActive || !currentExpandedPortal || isClosingDetail) return;

    var portal = currentExpandedPortal;
    var frameEl = activeOriginFrame;

    // 1. Immediately cross-fade: hide detail container, reveal preview face
    portal.classList.remove('is-content-revealed');

    portal.classList.remove('is-expanded');

    portal.style.left = activeOriginRect.left + 'px';
    portal.style.width = activeOriginRect.width + 'px';
    portal.style.height = activeOriginRect.height + 'px';

    if (container) container.classList.remove('ynw-receding');
    if (backdrop) backdrop.classList.remove('is-active');

    // 4. Seamless transition handoff: only swap when transition settles
    var hasCleanedUp = false;
    function finalizeClose() {
      if (hasCleanedUp) return;
      hasCleanedUp = true;

      if (frameEl) {
        frameEl.classList.remove('is-concealed');
      }
      if (portal && portal.parentNode) {
        portal.parentNode.removeChild(portal);
      }
      currentExpandedPortal = null;
      activeOriginFrame = null;
      activeOriginReel = null;
      activeOriginRect = null;
      isDetailActive = false;
      isClosingDetail = false;
    }

    portal.addEventListener('transitionend', function onEnd(e) {
      if (e.target === portal && (e.propertyName === 'width' || e.propertyName === 'top')) {
        portal.removeEventListener('transitionend', onEnd);
        finalizeClose();
      }
    });

    setTimeout(finalizeClose, 650);

  var activeHoverReel = null;

      activeHoverReel = el.getAttribute('data-reel');
    });
    el.addEventListener('mouseleave', function() {
      activeHoverReel = null;
    });
  });

    if (e.key === 'Escape' && lb && lb.classList.contains('is-open')) {

      e.preventDefault();
      return;

      closeFilmDetail();
      e.preventDefault();
      return;

      e.preventDefault();
